########################################################################
# STACK 2/2 — Application OpenStock
#
# Pré-requis :
#   - Le Dockerfile de ton fork doit être remplacé par la version avec
#     les ARG/ENV (voir message).
#   - Le stack "openstock-db" (stack 1) doit déjà tourner et être healthy.
#
# Méthode de déploiement dans Portainer : "Repository", pointant vers
# TON FORK GitHub (le build a besoin du vrai code source).
#   - Repository URL : https://github.com/<TON-COMPTE>/OpenStock.git
#   - Repository reference : refs/heads/main (ou ta branche)
#   - Colle ce YAML dans le champ prévu (ou commite-le dans le repo).
#
# Renseigne dans "Environment variables" les mêmes ${...} que ci-dessous.
########################################################################

services:
  openstock:
    build:
      context: .
      dockerfile: Dockerfile
      extra_hosts:
        - "mongodb:host-gateway"
      args:
        NODE_ENV: production
        MONGODB_URI: mongodb://root:example@mongodb:27017/openstock?authSource=admin
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        NEXT_PUBLIC_FINNHUB_API_KEY: ${FINNHUB_API_KEY}
        FINNHUB_BASE_URL: https://finnhub.io/api/v1
        GEMINI_API_KEY: ${GEMINI_API_KEY}
        AI_PROVIDER: gemini
        INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
        NODEMAILER_EMAIL: ${NODEMAILER_EMAIL}
        NODEMAILER_PASSWORD: ${NODEMAILER_PASSWORD}
    container_name: openstock
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Répété ici pour le conteneur EN FONCTIONNEMENT (le build ci-dessus
      # ne couvre que l'étape "npm run build").
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      MONGODB_URI: mongodb://root:example@mongodb:27017/openstock?authSource=admin
      NEXT_PUBLIC_FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FINNHUB_BASE_URL: https://finnhub.io/api/v1
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      NODEMAILER_EMAIL: ${NODEMAILER_EMAIL}
      NODEMAILER_PASSWORD: ${NODEMAILER_PASSWORD}
    networks:
      - openstock-net

networks:
  openstock-net:
    external: true
    name: openstock-net
